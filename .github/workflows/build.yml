name: Generer un APK Android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @capacitor/cli
      - run: npm install @capacitor/core @capacitor/android
      
      - name: Preparation du dossier www
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.PNG www/ 2>/dev/null || true
          
      - name: Initialisation de Capacitor
        run: |
          npx cap init Ngonda com.ngonda.app --web-dir=www
          npx cap add android
          
      - name: Force la resolution des doublons Kotlin
        run: |
          echo "subprojects { configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } } }" >> android/build.gradle
          npx cap sync
          
      - name: Creation de l'application Android
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug
          
      - name: Televerser un fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
