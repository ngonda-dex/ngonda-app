name: Générer un APK Android
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installation du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Configuration de Java 17 par defaut
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME_17_X64/bin:$PATH" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @capacitor/cli
      - run: npm install @capacitor/core @capacitor/android
      
      - name: Preparation du dossier www
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.PNG www/ 2>/dev/null || true
          
      - run: npx cap init Ngonda com.ngonda.app --web-dir=www
      - run: npx cap add android
      - run: npx cap sync
      
      - name: Créer une application Android
        run: |
          cd android && ./gradlew assembleDebug
          
      - name: Téléverser un fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
